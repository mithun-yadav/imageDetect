<div class="preview-container">
    @if (result()) {
    <div class="image-view-controls">
        <span class="view-label">IMAGE VIEW</span>

        <div class="view-toggle" role="group" aria-label="Image comparison">
            <button type="button" [class.active]="!showAnnotations()" [attr.aria-pressed]="!showAnnotations()"
                (click)="toggleAnnotations(false)">
                Original
            </button>

            <button type="button" [class.active]="showAnnotations()" [attr.aria-pressed]="showAnnotations()"
                (click)="toggleAnnotations(true)">
                Annotated
            </button>
        </div>
    </div>
    }

    <div class="image-stage" [style.aspect-ratio]="imageAspectRatio()">
        <img class="preview-image" [src]="previewUrl()" alt="Original image with object detection annotations" />

        @if (result() && showAnnotations()) {
        <svg class="detection-overlay" [attr.viewBox]="
          '0 0 ' +
          result()!.result.image_width +
          ' ' +
          result()!.result.image_height
        " preserveAspectRatio="none">
            @for (item of overlayDetections(); track item.id) {
            <g>
                <rect [attr.x]="item.x" [attr.y]="item.y" [attr.width]="item.width" [attr.height]="item.height"
                    [attr.stroke]="item.color" fill="none" stroke-width="2.5" vector-effect="non-scaling-stroke" />

                <rect [attr.x]="item.labelX" [attr.y]="item.labelY" [attr.width]="item.labelWidth"
                    [attr.height]="item.labelHeight" [attr.fill]="item.color" rx="3" />

                <text [attr.x]="item.labelX + 7" [attr.y]="item.labelY + 15" fill="#ffffff" font-size="12"
                    font-weight="600">
                    {{ item.label }}
                </text>
            </g>
            }
        </svg>
        }
    </div>

    <div class="preview-toolbar">
        <div class="file-details">
            <strong>{{ selectedFile()?.name }}</strong>
            <span>
                {{ ((selectedFile()?.size ?? 0) / 1024 / 1024).toFixed(2) }}
                MB
            </span>
        </div>

        <button class="remove-button" type="button" [disabled]="isProcessing()" (click)="removeFile()">
            Remove
        </button>
    </div>
</div>
